# Nginx config for techbrahmand.giftsngifts.in
# Copy this to: /etc/nginx/sites-available/techbrahmand.giftsngifts.in
# Then symlink:  ln -s /etc/nginx/sites-available/techbrahmand.giftsngifts.in /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name techbrahmand.giftsngifts.in;

    # Frontend — serve the built Vite static files
    root /var/www/techbrahmand/frontend/dist;
    index index.html;

    # Proxy /api/* requests to the Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:2000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA fallback — all non-file routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
